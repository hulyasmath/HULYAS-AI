<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ZEQ Sync + Matter.js Example</title>
  <style>
    body { 
      margin: 0; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh;
      background: #1a1a2e;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: monospace;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 5px;
    }
    canvas {
      border: 2px solid #6366f1;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div id="info">
    <div>ZEQ Sync + Matter.js Demo</div>
    <div>Gravity modulated by KO42 (1.287 Hz)</div>
    <div>Zeqond: <span id="zeqond">0</span></div>
    <div>Gravity Y: <span id="gravity">-9.81</span></div>
    <div>Bodies: <span id="bodies">0</span></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script src="zeq-sync-plugin.js"></script>
  <script>
    // Matter.js module aliases
    const { Engine, Render, World, Bodies, Mouse, MouseConstraint, Composite } = Matter;

    // Create engine with normal gravity
    const engine = Engine.create();
    engine.gravity.y = 1;

    // Create renderer
    const render = Render.create({
      element: document.body,
      engine: engine,
      options: {
        width: 800,
        height: 600,
        wireframes: false,
        background: '#0f0f1a'
      }
    });

    // Create ground and walls
    const ground = Bodies.rectangle(400, 590, 810, 30, { 
      isStatic: true,
      render: { fillStyle: '#4c1d95' }
    });
    const leftWall = Bodies.rectangle(5, 300, 30, 600, { 
      isStatic: true,
      render: { fillStyle: '#4c1d95' }
    });
    const rightWall = Bodies.rectangle(795, 300, 30, 600, { 
      isStatic: true,
      render: { fillStyle: '#4c1d95' }
    });

    World.add(engine.world, [ground, leftWall, rightWall]);

    // Add some initial balls
    const colors = ['#6366f1', '#8b5cf6', '#a855f7', '#d946ef', '#ec4899'];
    for (let i = 0; i < 20; i++) {
      const ball = Bodies.circle(
        100 + Math.random() * 600,
        50 + Math.random() * 200,
        15 + Math.random() * 20,
        {
          restitution: 0.8,
          render: { fillStyle: colors[i % colors.length] }
        }
      );
      World.add(engine.world, ball);
    }

    // Add mouse control
    const mouse = Mouse.create(render.canvas);
    const mouseConstraint = MouseConstraint.create(engine, {
      mouse: mouse,
      constraint: {
        stiffness: 0.2,
        render: { visible: false }
      }
    });
    World.add(engine.world, mouseConstraint);
    render.mouse = mouse;

    // Start Matter.js renderer
    Render.run(render);

    // Create ZEQ Sync instance
    const sync = ZeqSync.create({ autoStart: true });

    // Attach Matter.js with gravity modulation
    sync.attachMatterJS(engine, {
      modulateGravity: true,
      baseGravity: 1,
      onUpdate: (pulseData, engine) => {
        // Update info display
        document.getElementById('zeqond').textContent = pulseData.zeqond.toFixed(2);
        document.getElementById('gravity').textContent = engine.gravity.y.toFixed(4);
        document.getElementById('bodies').textContent = Composite.allBodies(engine.world).length;
      }
    });

    // Click to add new balls
    render.canvas.addEventListener('click', (e) => {
      const rect = render.canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      const ball = Bodies.circle(x, y, 15 + Math.random() * 20, {
        restitution: 0.8,
        render: { fillStyle: colors[Math.floor(Math.random() * colors.length)] }
      });
      World.add(engine.world, ball);
    });
  </script>
</body>
</html>
