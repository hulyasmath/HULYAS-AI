<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ZEQ Sync + D3.js Example</title>
  <style>
    body { 
      margin: 0; 
      display: flex; 
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: monospace;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 5px;
    }
    h1 {
      color: white;
      margin-top: 20px;
    }
    svg {
      background: #0f0f1a;
      border: 2px solid #6366f1;
      border-radius: 10px;
      margin-top: 20px;
    }
    .axis text { fill: #888; }
    .axis line, .axis path { stroke: #444; }
  </style>
</head>
<body>
  <div id="info">
    <div>ZEQ Sync + D3.js Demo</div>
    <div>Real-time HulyaPulse Waveform</div>
    <div>Zeqond: <span id="zeqond">0</span></div>
    <div>Frequency: 1.287 Hz</div>
  </div>
  
  <h1>KO42 HulyaPulse Waveform</h1>
  <svg id="chart" width="800" height="400"></svg>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="zeq-sync-plugin.js"></script>
  <script>
    // Chart setup
    const svg = d3.select('#chart');
    const width = 800;
    const height = 400;
    const margin = { top: 20, right: 30, bottom: 40, left: 50 };
    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;

    const g = svg.append('g')
      .attr('transform', `translate(${margin.left},${margin.top})`);

    // Data buffer for waveform (last 5 seconds of data)
    const dataBuffer = [];
    const maxPoints = 300;
    const timeWindow = 5; // seconds

    // Scales
    const xScale = d3.scaleLinear()
      .domain([0, timeWindow])
      .range([0, innerWidth]);

    const yScale = d3.scaleLinear()
      .domain([-0.15, 0.15])
      .range([innerHeight, 0]);

    // Axes
    const xAxis = d3.axisBottom(xScale).ticks(10);
    const yAxis = d3.axisLeft(yScale).ticks(5);

    g.append('g')
      .attr('class', 'axis x-axis')
      .attr('transform', `translate(0,${innerHeight})`)
      .call(xAxis);

    g.append('g')
      .attr('class', 'axis y-axis')
      .call(yAxis);

    // Axis labels
    g.append('text')
      .attr('x', innerWidth / 2)
      .attr('y', innerHeight + 35)
      .attr('fill', '#888')
      .attr('text-anchor', 'middle')
      .text('Time (seconds)');

    g.append('text')
      .attr('transform', 'rotate(-90)')
      .attr('x', -innerHeight / 2)
      .attr('y', -35)
      .attr('fill', '#888')
      .attr('text-anchor', 'middle')
      .text('KO42 Sync Value');

    // Line generator
    const line = d3.line()
      .x(d => xScale(d.time))
      .y(d => yScale(d.value))
      .curve(d3.curveMonotoneX);

    // Path for waveform
    const path = g.append('path')
      .attr('fill', 'none')
      .attr('stroke', '#6366f1')
      .attr('stroke-width', 2);

    // Gradient fill under the line
    const gradient = svg.append('defs')
      .append('linearGradient')
      .attr('id', 'area-gradient')
      .attr('gradientUnits', 'userSpaceOnUse')
      .attr('x1', 0).attr('y1', yScale(0.15))
      .attr('x2', 0).attr('y2', yScale(-0.15));
    
    gradient.append('stop')
      .attr('offset', '0%')
      .attr('stop-color', '#6366f1')
      .attr('stop-opacity', 0.3);
    
    gradient.append('stop')
      .attr('offset', '50%')
      .attr('stop-color', '#6366f1')
      .attr('stop-opacity', 0);
    
    gradient.append('stop')
      .attr('offset', '100%')
      .attr('stop-color', '#6366f1')
      .attr('stop-opacity', 0.3);

    const area = d3.area()
      .x(d => xScale(d.time))
      .y0(yScale(0))
      .y1(d => yScale(d.value))
      .curve(d3.curveMonotoneX);

    const areaPath = g.append('path')
      .attr('fill', 'url(#area-gradient)');

    // Zero line
    g.append('line')
      .attr('x1', 0)
      .attr('x2', innerWidth)
      .attr('y1', yScale(0))
      .attr('y2', yScale(0))
      .attr('stroke', '#444')
      .attr('stroke-dasharray', '5,5');

    // Current value indicator
    const indicator = g.append('circle')
      .attr('r', 6)
      .attr('fill', '#ec4899');

    // Zeqond markers
    const zeqondMarkers = g.append('g').attr('class', 'zeqond-markers');

    // Create ZEQ Sync
    const sync = ZeqSync.create({ autoStart: true });
    let startTime = null;

    // Attach D3.js
    sync.attachD3JS((pulseData) => {
      if (startTime === null) startTime = pulseData.time;
      const relativeTime = pulseData.time - startTime;

      // Add new data point
      dataBuffer.push({
        time: relativeTime % timeWindow,
        value: pulseData.syncValue,
        zeqond: pulseData.zeqond
      });

      // Keep only recent data
      while (dataBuffer.length > maxPoints) {
        dataBuffer.shift();
      }

      // Sort by time for proper rendering
      const sortedData = [...dataBuffer].sort((a, b) => a.time - b.time);

      // Update waveform
      path.attr('d', line(sortedData));
      areaPath.attr('d', area(sortedData));

      // Update indicator position
      if (sortedData.length > 0) {
        const lastPoint = sortedData[sortedData.length - 1];
        indicator
          .attr('cx', xScale(lastPoint.time))
          .attr('cy', yScale(lastPoint.value));
      }

      // Update info display
      document.getElementById('zeqond').textContent = pulseData.zeqond.toFixed(2);

      // Reset buffer when time wraps
      if (relativeTime > 0 && (relativeTime % timeWindow) < 0.1) {
        // Clear old data on wrap
        dataBuffer.length = 0;
      }
    });
  </script>
</body>
</html>
