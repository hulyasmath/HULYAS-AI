# Standalone local config: Uses pre-built dev image + mounts only ZEQ custom code
# Run with: docker compose -f docker-compose.local.yml up -d

services:
  api:
    container_name: LibreChat
    image: ghcr.io/danny-avila/librechat-dev:latest
    ports:
      - "3080:3080"
    depends_on:
      - mongodb
      - meilisearch
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - RAG_PORT=8000
      - RAG_API_URL=http://rag_api:8000
      - SEARXNG_INSTANCE_URL=http://searxng:8080
    volumes:
      # Config
      - ./.env:/app/.env
      - ./librechat.yaml:/app/librechat.yaml
      # ZEQ custom code (mount specific files, NOT entire directories)
      - ./api/data/auth.json:/app/api/data/auth.json
      - ./client/dist:/app/client/dist
      - ./client/public:/app/client/public
      - ./packages/zeq-sdk:/app/packages/zeq-sdk
      - ./zeq-operators:/app/zeq-operators
      - ./chrome-extension/docs:/app/zeq-papers
      # Persistent storage
      - ./uploads:/app/uploads
      - ./logs:/app/api/logs
      - ./images:/app/client/public/images

  mongodb:
    container_name: chat-mongodb
    image: mongo
    restart: always
    volumes:
      - zeq_mongodb_data:/data/db
    command: mongod --noauth

  meilisearch:
    container_name: chat-meilisearch
    image: getmeili/meilisearch:v1.12.3
    restart: always
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - zeq_meili_data:/meili_data

  vectordb:
    container_name: vectordb
    image: pgvector/pgvector:0.8.0-pg15-trixie
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    restart: always
    volumes:
      - pgdata2:/var/lib/postgresql/data

  rag_api:
    container_name: rag_api
    image: ghcr.io/danny-avila/librechat-rag-api-dev:latest
    environment:
      - DB_HOST=vectordb
      - DB_PORT=5432
      - POSTGRES_DB=mydatabase
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - RAG_PORT=8000
      - EMBEDDINGS_PROVIDER=openai
      - EMBEDDINGS_MODEL=text-embedding-3-small
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: always
    depends_on:
      - vectordb
    env_file:
      - .env

  searxng:
    container_name: searxng
    image: searxng/searxng:latest
    restart: always
    ports:
      - "8888:8080"
    volumes:
      - ./searxng-data:/etc/searxng:rw
    environment:
      - SEARXNG_HOSTNAME=http://searxng:8080
      - SEARXNG_BASE_URL=http://localhost:8888

volumes:
  zeq_mongodb_data:
  zeq_meili_data:
  pgdata2:
