# Zeq OS SDK MCP Server - Provides AI access to the Mathematical Framework
mcpServers:
  zeq-sdk:
    type: stdio
    command: node
    args:
      - /app/packages/zeq-sdk/mcp/server.js
    timeout: 60000
    iconPath: /app/client/public/assets/hulyas.gif
    env:
      PAPERS_DIR: /app/zeq-papers

  code-sandbox:
    type: sse
    url: http://code_sandbox:8001/sse
    timeout: 60000
    headers:
      Host: code_sandbox:8001
    serverInstructions: |
      Code Sandbox provides secure code execution in isolated Docker containers.
      Available tools:
      - run_python_code: Execute Python code safely (numpy, pandas, matplotlib included)
      - run_javascript_code: Execute JavaScript/Node.js code safely
      Use this for code execution, data analysis, calculations, and testing.

# Definition of custom endpoints
endpoints:
  # Agents endpoint - enabled with MCP tools support
  agents:
    # Custom icon and label
    iconURL: '/assets/hulyas.gif'
    modelDisplayLabel: 'HULYAS'
    # Allow providers for agents
    allowedProviders:
      - "DeepSeek"
    # Default recursion depth for agents
    recursionLimit: 50
    # Max recursion depth for agents
    maxRecursionLimit: 100
    # Don't disable the builder interface
    disableBuilder: false
    # Maximum total citations to include in agent responses
    maxCitations: 30
    # Maximum citations per file
    maxCitationsPerFile: 7
    # Minimum relevance score for sources
    minRelevanceScore: 0.45
    # Agent Capabilities
    capabilities: ["file_search", "actions", "tools", "execute_code"]
  # assistants:
  #   disableBuilder: false # Disable Assistants Builder Interface by setting to `true`
  #   pollIntervalMs: 3000  # Polling interval for checking assistant updates
  #   timeoutMs: 180000  # Timeout for assistant operations
  #   # Should only be one or the other, either `supportedIds` or `excludedIds`
  #   supportedIds: ["asst_supportedAssistantId1", "asst_supportedAssistantId2"]
  #   # excludedIds: ["asst_excludedAssistantId"]
  #   # Only show assistants that the user created or that were created externally (e.g. in Assistants playground).
  #   # privateAssistants: false # Does not work with `supportedIds` or `excludedIds`
  #   # (optional) Models that support retrieval, will default to latest known OpenAI models that support the feature
  #   retrievalModels: ["gpt-4-turbo-preview"]
  #   # (optional) Assistant Capabilities available to all users. Omit the ones you wish to exclude. Defaults to list below.
  #   capabilities: ["code_interpreter", "retrieval", "actions", "tools", "image_vision"]
  custom:
    # ============================================
    # DeepSeek - Default Provider (single model)
    # ============================================
    - name: 'DeepSeek'
      type: 'openAI'
      apiKey: '${DEEPSEEK_API_KEY}'
      baseURL: 'https://api.deepseek.com/v1'
      models:
        default:
          - 'deepseek-chat'
        fetch: false
      titleConvo: true
      titleModel: 'deepseek-chat'
      modelDisplayLabel: 'HULYAS'
      iconURL: '/assets/hulyas.gif'
      addParams:
        temperature: 0.1
        max_tokens: 4096

    # Fireworks removed from active endpoints

# Model Specs - Two options: HULYAS chat + Agents
modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: "zeq-mi"
      label: "Zeq MI"
      description: "Zeq OS Mathematical Intelligence"
      default: true
      iconURL: "/assets/hulyas.gif"
      preset:
        endpoint: "DeepSeek"
        model: "deepseek-chat"
        modelLabel: "HULYAS"
    - name: "agents"
      label: "My Agents"
      description: "Agents with MCP Tools"
      preset:
        endpoint: "agents"

