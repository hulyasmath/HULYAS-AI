# File upload configuration
fileConfig:
  endpoints:
    # DeepSeek endpoint file uploads
    DeepSeek:
      fileLimit: 10
      fileSizeLimit: 50
      totalSizeLimit: 100
      supportedMimeTypes:
        - "image/.*"
        - "application/pdf"
        - "text/.*"
    # Agents endpoint (for MCP tools)
    agents:
      fileLimit: 10
      fileSizeLimit: 50
      totalSizeLimit: 100
      supportedMimeTypes:
        - "image/.*"
        - "application/pdf"
        - "text/.*"
    default:
      totalSizeLimit: 50
      supportedMimeTypes:
        - "image/.*"
        - "application/pdf"
        - "text/.*"
  serverFileSizeLimit: 100
  avatarSizeLimit: 2

# Example fileConfig (commented out):
