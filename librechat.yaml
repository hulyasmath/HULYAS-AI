# Web Search Configuration
webSearch:
  # Search provider - using SearXNG (self-hosted, no API keys required)
  searchProvider: searxng
  searxngInstanceUrl: '${SEARXNG_INSTANCE_URL}'
  searxngApiKey: '${SEARXNG_API_KEY}'  # Optional, not required for basic SearXNG setup
  # Safe search filter
  safeSearch: 1
  # Optional: Jina Reranking Configuration (for better result ranking)
  # jinaApiKey: '${JINA_API_KEY}'
  # jinaApiUrl: '${JINA_API_URL}'
  # Optional: Other rerankers
  # cohereApiKey: '${COHERE_API_KEY}'
  # Optional: Content scrapers (for better content extraction)
  # firecrawlApiKey: '${FIRECRAWL_API_KEY}'
  # firecrawlApiUrl: '${FIRECRAWL_API_URL}'

